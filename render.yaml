services:
  - type: web
    name: electronics-api
    runtime: docker
    plan: free
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: CLIENT_URL
        sync: false
      - key: API_PUBLIC_URL
        value: https://electronics-api-a55b.onrender.com
      - key: PAYMENT_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: console
      - key: AUTO_IMPORT_CATALOG
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true
