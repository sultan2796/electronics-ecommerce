    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Elektronika onlayn mağazası: qulaqlıqlar, noutbuklar, smartfonlar və aksesuarlar." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ElectroShop" />
    <meta property="og:locale" content="az_AZ" />
    <meta property="og:title" content="ElectroShop — elektronika onlayn mağazası" />
    <meta property="og:description" content="Smartfon, noutbuk, planşet və aksesuarlar rəsmi zəmanət və sürətli çatdırılma ilə." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>ElectroShop — elektronika onlayn mağazası</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark" || ((!stored || stored === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (error) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
